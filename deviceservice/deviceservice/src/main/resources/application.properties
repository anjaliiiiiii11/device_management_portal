spring.application.name=deviceservice

# Eureka client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.preferIpAddress=true

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/device_details
spring.datasource.username=root
spring.datasource.password=''

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevent Hibernate from converting camelCase to snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Logging for debugging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Server port
server.port=8082
logging.config=classpath:log4j2-spring.xml


# splunk
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
logging.level.org.springframework.boot.context.config=TRACE
logging.level.org.springframework.cloud.config=DEBUG
management.otlp.tracing.endpoint=http://localhost:4318
management.otlp.tracing.protocol=http
management.tracing.zipkin.enabled=false

# actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.metrics.enabled=true

# SMTP config (example for Gmail SMTP - for production use a proper SMTP provider)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=''#add email here
spring.mail.password='' # for eg create your password yxampwxapdxtmaci
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# static admin recipient 
notification.admin.email="" #add admin email here

# WebSocket allowed origins (CORS)
spring.websocket.allowed-origins=http://localhost:3000
